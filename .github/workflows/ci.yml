name: CI

# Push/PR check for the no-mistakes ci gate. PR #2 and #3 merged CLEAN
# only because this repo had no required (or any) checks.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Run pytest
        run: uv run --with pytest pytest .claude/skills/sssf/scripts/ tests/ -q
